# Local development stack for Vero. SCAFFOLD ONLY — not production-ready and
# not yet exercised. `docker compose up` will need the Dockerfile in
# docker/backend.Dockerfile fleshed out first.
#
# The web app is deliberately absent: Next.js runs faster on the host with
# `npm run dev`, and containerising it buys nothing during development.

services:
  postgres:
    image: postgres:17-alpine
    container_name: vero-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vero}
      POSTGRES_USER: ${POSTGRES_USER:-vero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vero}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vero}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vero-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: vero-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Uncomment once there are tasks to run. Shares the backend image on purpose:
  # the worker must have exactly the code it is executing.
  # celery:
  #   build:
  #     context: ./backend
  #     dockerfile: ../docker/backend.Dockerfile
  #   container_name: vero-celery
  #   command: celery -A config worker --loglevel=info
  #   volumes:
  #     - ./backend:/app
  #   env_file:
  #     - .env
  #   depends_on:
  #     - backend
  #     - redis

volumes:
  postgres_data:
  redis_data:
