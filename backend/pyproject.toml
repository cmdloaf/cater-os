# Tooling configuration for the Vero backend.
# There is no [project] table: the backend is a deployed Django application, not
# a distributable package, so it is not built or installed as one.

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  | migrations
  | \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort — import ordering
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is black's job
]

[tool.ruff.lint.per-file-ignores]
# Settings modules legitimately use star imports to layer over base.py.
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db"
testpaths = ["apps"]
