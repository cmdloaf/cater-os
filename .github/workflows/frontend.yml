jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the whole workspace from the root lockfile.
      - run: npm ci

      # - run: npm run lint
      # - run: npx tsc --noEmit --project apps/web/tsconfig.json
      - run: npm run build
