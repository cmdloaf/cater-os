# SCAFFOLD — intentionally incomplete.
#
# Manual trigger only. Enable the push/pull_request triggers once the backend
# has code worth checking.

name: Backend

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Lint and system check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements/development.txt

      # - run: ruff check .
      # - run: black --check .

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py check

      # Catches models changed without a matching migration.
      # - name: Check for missing migrations
      #   run: python manage.py makemigrations --check --dry-run
